<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dan's Wine Cellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #0b201f;
    --surface:     #0e2826;
    --card:        #112b29;
    --card-hover:  #143330;
    --border:      #2b4e44;
    --border-soft: #1e3d38;
    --mint:        #8cfcba;
    --lime:        #c4e456;
    --pink:        #eb316f;
    --cream:       #f6f9f2;
    --text:        #e8f2ee;
    --muted:       #5d8a7e;
    --muted2:      #3d6b62;
    --drink-now:   #eb316f;
    --peak:        #c4e456;
    --hold:        #8cfcba;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── NAV ─── */
  header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--mint);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .logo-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--cream);
    letter-spacing: -0.2px;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .nav-stats {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .nav-stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .nav-stat .val {
    font-size: 18px;
    font-weight: 700;
    color: var(--mint);
    letter-spacing: -0.5px;
  }
  .nav-stat .lbl {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .btn-add {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--mint);
    color: var(--bg);
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-add:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-add svg { flex-shrink: 0; }

  /* ─── CONTROLS ─── */
  .controls {
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 64px;
    z-index: 99;
  }
  .controls-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 280px;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px 7px 34px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: var(--mint); }

  .divider-v {
    width: 1px;
    height: 20px;
    background: var(--border);
    flex-shrink: 0;
  }

  .chips {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .chip {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    transition: all 0.2s;
    user-select: none;
  }
  .chip:hover { border-color: var(--mint); color: var(--text); }
  .chip.active { background: var(--mint); border-color: var(--mint); color: var(--bg); font-weight: 600; }
  .chip[data-status="Drink Now"].active { background: var(--drink-now); border-color: var(--drink-now); color: #fff; }
  .chip[data-status="Peak"].active      { background: var(--peak);      border-color: var(--peak);      color: var(--bg); }
  .chip[data-status="Hold"].active      { background: var(--hold);      border-color: var(--hold);      color: var(--bg); }

  .sort-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .sort-wrap label {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }
  .sort-wrap select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .sort-wrap select:focus { border-color: var(--mint); }

  /* ─── MAIN ─── */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 32px 64px;
  }
  .grid-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .grid-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  /* ─── GRID ─── */
  #wine-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  /* ─── CARD ─── */
  .wine-card {
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1),
                box-shadow 0.25s cubic-bezier(0.4,0,0.2,1),
                border-color 0.25s;
    cursor: pointer;
    position: relative;
  }
  .wine-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
    border-color: var(--border);
    background: var(--card-hover);
  }
  .wine-card:hover .card-edit-hint {
    opacity: 1;
  }
  .card-edit-hint {
    position: absolute;
    top: 12px;
    right: 12px;
    opacity: 0;
    transition: opacity 0.2s;
    color: var(--muted);
    line-height: 1;
  }
  .card-edit-hint svg { display: block; }

  .card-stripe { height: 3px; }
  .card-stripe.drink-now { background: var(--drink-now); }
  .card-stripe.peak      { background: var(--peak); }
  .card-stripe.hold      { background: var(--hold); }

  .card-body {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding-right: 20px;
  }
  .wine-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--cream);
    line-height: 1.4;
    flex: 1;
  }
  .badge {
    flex-shrink: 0;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .badge.drink-now { background: rgba(235,49,111,0.15); color: var(--drink-now); border: 1px solid rgba(235,49,111,0.3); }
  .badge.peak      { background: rgba(196,228,86,0.12); color: var(--peak);      border: 1px solid rgba(196,228,86,0.3); }
  .badge.hold      { background: rgba(140,252,186,0.1); color: var(--hold);      border: 1px solid rgba(140,252,186,0.25); }

  .producer {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    margin-top: -6px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    background: rgba(43,78,68,0.5);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .tag strong { color: var(--text); font-weight: 600; }
  .tag.classification {
    background: rgba(140,252,186,0.07);
    border-color: rgba(140,252,186,0.2);
    color: var(--mint);
  }

  .card-divider {
    border: none;
    border-top: 1px solid var(--border-soft);
    margin: 0;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .value-block .lbl,
  .drink-block .lbl {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 4px;
  }
  .value-block .amount {
    font-size: 20px;
    font-weight: 700;
    color: var(--mint);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .value-block .range {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .drink-block { text-align: right; }
  .drink-block .window {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }
  .drink-block .window.urgent { color: var(--drink-now); font-weight: 600; }
  .drink-block .window.peak-w { color: var(--peak); }

  .notes {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    font-style: italic;
  }

  /* ─── LOADING / EMPTY ─── */
  #loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 0;
    color: var(--muted);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--mint);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; }
  #empty-msg {
    display: none;
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 0;
    font-size: 14px;
    color: var(--muted);
  }

  /* ─── DRAWER OVERLAY ─── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  /* ─── DRAWER ─── */
  .drawer {
    position: fixed;
    top: 0; right: 0;
    width: 440px;
    max-width: 100vw;
    height: 100%;
    background: #0e2826;
    border-left: 1px solid var(--border);
    z-index: 201;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    overflow: hidden;
  }
  .drawer.open {
    transform: translateX(0);
  }

  .drawer-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .drawer-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--cream);
  }
  .drawer-close {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
    line-height: 1;
    font-family: 'Inter', sans-serif;
  }
  .drawer-close:hover { border-color: var(--border); color: var(--text); background: rgba(255,255,255,0.04); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .drawer-body::-webkit-scrollbar { width: 4px; }
  .drawer-body::-webkit-scrollbar-track { background: transparent; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ─── FORM SECTIONS ─── */
  .form-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-grid .full { grid-column: 1 / -1; }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }
  .field input,
  .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .field input::placeholder,
  .field textarea::placeholder { color: var(--muted2); font-size: 12px; }
  .field input:focus,
  .field textarea:focus { border-color: var(--mint); }
  .field textarea { resize: vertical; min-height: 72px; line-height: 1.5; }
  .field input[type="number"] { -moz-appearance: textfield; }
  .field input[type="number"]::-webkit-inner-spin-button { display: none; }

  /* ─── STATUS TOGGLE ─── */
  .status-toggle {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .s-btn {
    padding: 8px 4px;
    border-radius: 6px;
    border: 1px solid var(--border-soft);
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s;
    line-height: 1.3;
  }
  .s-btn:hover { border-color: var(--border); color: var(--text); }
  .s-btn[data-val="Drink Now"].active { background: rgba(235,49,111,0.15); border-color: var(--drink-now); color: var(--drink-now); font-weight: 600; }
  .s-btn[data-val="Peak"].active      { background: rgba(196,228,86,0.12); border-color: var(--peak);      color: var(--peak);      font-weight: 600; }
  .s-btn[data-val="Hold"].active      { background: rgba(140,252,186,0.1); border-color: var(--hold);      color: var(--hold);      font-weight: 600; }

  /* ─── DRAWER FOOTER ─── */
  .drawer-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    background: #0e2826;
  }
  .btn-save {
    flex: 1;
    padding: 10px;
    border-radius: 7px;
    border: none;
    background: var(--mint);
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-save:hover { opacity: 0.88; }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-cancel {
    padding: 10px 16px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel:hover { color: var(--text); border-color: var(--border); }

  .btn-delete {
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid rgba(235,49,111,0.3);
    background: rgba(235,49,111,0.08);
    color: var(--drink-now);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-delete:hover { background: rgba(235,49,111,0.18); border-color: var(--drink-now); }
  .btn-delete.confirm { background: var(--drink-now); color: #fff; border-color: var(--drink-now); }

  /* ─── DRAWER MSG ─── */
  .drawer-msg {
    display: none;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-top: -12px;
  }
  .drawer-msg.ok  { background: rgba(140,252,186,0.1); border: 1px solid rgba(140,252,186,0.3); color: var(--mint); }
  .drawer-msg.err { background: rgba(235,49,111,0.1);  border: 1px solid rgba(235,49,111,0.3);  color: var(--drink-now); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 640px) {
    .nav-stats { display: none; }
    .nav-inner  { padding: 0 16px; }
    .controls-inner { padding: 0 16px; height: auto; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
    .sort-wrap { margin-left: 0; }
    main { padding: 20px 16px 48px; }
    #wine-grid { grid-template-columns: 1fr; }
    .drawer { width: 100%; }
  }
</style>
</head>
<body>

<!-- ─── NAV ─── -->
<header>
  <div class="nav-inner">
    <a class="logo" href="#">
      <div class="logo-dot"></div>
      <span class="logo-label">Dan's Wine Cellar</span>
    </a>
    <div class="nav-right">
      <div class="nav-stats">
        <div class="nav-stat">
          <span class="val" id="stat-total">—</span>
          <span class="lbl">Bottles</span>
        </div>
        <div class="nav-stat">
          <span class="val" id="stat-drink-now" style="color:var(--drink-now)">—</span>
          <span class="lbl">Drink Now</span>
        </div>
        <div class="nav-stat">
          <span class="val" id="stat-value">—</span>
          <span class="lbl">Est. Value</span>
        </div>
      </div>
      <button class="btn-add" id="btn-add-wine">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Add Wine
      </button>
    </div>
  </div>
</header>

<!-- ─── CONTROLS ─── -->
<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search" placeholder="Search wine, region, variety…">
    </div>
    <div class="divider-v"></div>
    <div class="chips">
      <div class="chip active" data-status="All">All</div>
      <div class="chip" data-status="Drink Now">Drink Now</div>
      <div class="chip" data-status="Peak">Peak</div>
      <div class="chip" data-status="Hold">Hold</div>
    </div>
    <div class="sort-wrap">
      <label for="sort-select">Sort</label>
      <select id="sort-select">
        <option value="urgency">Drink Urgency</option>
        <option value="value-desc">Value: High → Low</option>
        <option value="value-asc">Value: Low → High</option>
        <option value="vintage-asc">Vintage: Oldest First</option>
        <option value="vintage-desc">Vintage: Newest First</option>
        <option value="name">Name A → Z</option>
        <option value="country">Country</option>
      </select>
    </div>
  </div>
</div>

<!-- ─── MAIN ─── -->
<main>
  <div class="grid-meta">
    <span class="grid-count" id="grid-label">Loading cellar…</span>
  </div>
  <div id="wine-grid">
    <div id="loading"><div class="spinner"></div><p>Loading your cellar…</p></div>
  </div>
  <div id="empty-msg">No wines match your filter.</div>
</main>

<!-- ─── OVERLAY ─── -->
<div class="overlay" id="overlay"></div>

<!-- ─── DRAWER ─── -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title" id="drawer-title">Add Wine</span>
    <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
  </div>

  <div class="drawer-body">

    <!-- Basic info -->
    <div>
      <div class="form-section-label">Wine Details</div>
      <div class="form-grid">
        <div class="field full">
          <label>Name *</label>
          <input type="text" id="f-name" placeholder="e.g. Stag's Leap Cabernet Sauvignon">
        </div>
        <div class="field full">
          <label>Producer / Winery</label>
          <input type="text" id="f-producer" placeholder="e.g. Stag's Leap Wine Cellars">
        </div>
        <div class="field">
          <label>Vintage</label>
          <input type="text" id="f-vintage" placeholder="e.g. 2021 or NV">
        </div>
        <div class="field">
          <label>Country</label>
          <input type="text" id="f-country" placeholder="e.g. USA">
        </div>
        <div class="field full">
          <label>Variety / Grape</label>
          <input type="text" id="f-variety" placeholder="e.g. Cabernet Sauvignon">
        </div>
        <div class="field full">
          <label>Region / AVA</label>
          <input type="text" id="f-region" placeholder="e.g. Stags Leap District, Napa Valley">
        </div>
        <div class="field full">
          <label>Classification</label>
          <input type="text" id="f-classification" placeholder="e.g. DOC, Gran Reserva, Estate">
        </div>
      </div>
    </div>

    <!-- Value -->
    <div>
      <div class="form-section-label">Value & Drinking Window</div>
      <div class="form-grid">
        <div class="field">
          <label>Value Low ($)</label>
          <input type="number" id="f-val-low" placeholder="e.g. 45" min="0">
        </div>
        <div class="field">
          <label>Value High ($)</label>
          <input type="number" id="f-val-high" placeholder="e.g. 70" min="0">
        </div>
        <div class="field">
          <label>Drink From</label>
          <input type="text" id="f-drink-from" placeholder="e.g. 2026 or Now">
        </div>
        <div class="field">
          <label>Drink By</label>
          <input type="text" id="f-drink-by" placeholder="e.g. 2032">
        </div>
      </div>
    </div>

    <!-- Status -->
    <div>
      <div class="form-section-label">Status</div>
      <div class="status-toggle">
        <div class="s-btn active" data-val="Hold">Hold</div>
        <div class="s-btn" data-val="Peak">Peak</div>
        <div class="s-btn" data-val="Drink Now">Drink Now</div>
      </div>
    </div>

    <!-- Notes -->
    <div>
      <div class="form-section-label">Notes</div>
      <div class="field">
        <textarea id="f-notes" placeholder="Tasting notes, cellar recommendations…"></textarea>
      </div>
    </div>

    <!-- Feedback msg -->
    <div class="drawer-msg" id="drawer-msg"></div>

  </div><!-- /drawer-body -->

  <div class="drawer-footer">
    <button class="btn-delete" id="btn-delete" style="display:none">Delete</button>
    <button class="btn-cancel" id="btn-cancel">Cancel</button>
    <button class="btn-save"   id="btn-save">Add to Cellar</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getFirestore, collection, getDocs,
  addDoc, doc, updateDoc, deleteDoc
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBhmmAgAuBZ4mqjEr5CTolfbrPqK36s-aY",
  authDomain: "dans-wine-cellar.firebaseapp.com",
  projectId: "dans-wine-cellar",
  storageBucket: "dans-wine-cellar.firebasestorage.app",
  messagingSenderId: "30676784937",
  appId: "1:30676784937:web:a66f880457ce864de90938"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let allWines     = [];
let activeFilter = 'All';
let activeSort   = 'urgency';
let searchQuery  = '';

// ── Drawer state ────────────────────────────────────────────────────────────
let drawerMode   = 'add';   // 'add' | 'edit'
let editingId    = null;
let deleteConfirm = false;

const overlay    = document.getElementById('overlay');
const drawer     = document.getElementById('drawer');
const drawerTitle = document.getElementById('drawer-title');
const btnSave    = document.getElementById('btn-save');
const btnDelete  = document.getElementById('btn-delete');
const btnCancel  = document.getElementById('btn-cancel');
const drawerMsg  = document.getElementById('drawer-msg');

function openDrawer(mode, wine = null) {
  drawerMode = mode;
  editingId  = wine ? wine.id : null;
  deleteConfirm = false;

  drawerTitle.textContent = mode === 'add' ? 'Add Wine' : 'Edit Wine';
  btnSave.textContent     = mode === 'add' ? 'Add to Cellar' : 'Save Changes';
  btnDelete.style.display = mode === 'edit' ? 'block' : 'none';
  btnDelete.textContent   = 'Delete';
  btnDelete.classList.remove('confirm');
  hideMsg();

  // Populate or clear fields
  const fields = { name:'', producer:'', vintage:'', country:'',
                   variety:'', region:'', classification:'',
                   'val-low':'', 'val-high':'', 'drink-from':'', 'drink-by':'', notes:'' };

  if (wine) {
    fields.name           = wine.name           || '';
    fields.producer       = wine.producer       || '';
    fields.vintage        = wine.vintage        || '';
    fields.country        = wine.country        || '';
    fields.variety        = wine.variety        || '';
    fields.region         = wine.region         || '';
    fields.classification = wine.classification || '';
    fields['val-low']     = wine.value_low      != null ? wine.value_low  : '';
    fields['val-high']    = wine.value_high     != null ? wine.value_high : '';
    fields['drink-from']  = wine.drink_from     || '';
    fields['drink-by']    = wine.drink_by       || '';
    fields.notes          = wine.notes          || '';
  }

  Object.entries(fields).forEach(([k, v]) => {
    const el = document.getElementById('f-' + k);
    if (el) el.value = v;
  });

  // Status
  const status = wine ? (wine.status || 'Hold') : 'Hold';
  document.querySelectorAll('.s-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.val === status);
  });

  overlay.classList.add('open');
  drawer.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  document.body.style.overflow = '';
  deleteConfirm = false;
}

function getFormData() {
  const valLow  = parseFloat(document.getElementById('f-val-low').value)  || 0;
  const valHigh = parseFloat(document.getElementById('f-val-high').value) || 0;
  const statusEl = document.querySelector('.s-btn.active');
  return {
    name:           document.getElementById('f-name').value.trim(),
    producer:       document.getElementById('f-producer').value.trim(),
    vintage:        document.getElementById('f-vintage').value.trim(),
    country:        document.getElementById('f-country').value.trim(),
    variety:        document.getElementById('f-variety').value.trim(),
    region:         document.getElementById('f-region').value.trim(),
    classification: document.getElementById('f-classification').value.trim(),
    value_low:      valLow,
    value_high:     valHigh,
    value_mid:      valLow && valHigh ? (valLow + valHigh) / 2 : valLow || valHigh,
    drink_from:     document.getElementById('f-drink-from').value.trim(),
    drink_by:       document.getElementById('f-drink-by').value.trim(),
    status:         statusEl ? statusEl.dataset.val : 'Hold',
    notes:          document.getElementById('f-notes').value.trim(),
  };
}

function showMsg(text, type) {
  drawerMsg.textContent = text;
  drawerMsg.className   = `drawer-msg ${type}`;
  drawerMsg.style.display = 'block';
}
function hideMsg() { drawerMsg.style.display = 'none'; }

// ── Save (add or update) ────────────────────────────────────────────────────
btnSave.addEventListener('click', async () => {
  const data = getFormData();
  if (!data.name) { showMsg('Wine name is required.', 'err'); return; }

  btnSave.disabled = true;
  btnSave.textContent = drawerMode === 'add' ? 'Adding…' : 'Saving…';
  hideMsg();

  try {
    if (drawerMode === 'add') {
      const newWine = { ...data, quantity: 1,
        added_date:   new Date().toISOString().slice(0,10),
        last_updated: new Date().toISOString().slice(0,10) };
      const ref = await addDoc(collection(db, 'wines'), newWine);
      allWines.push({ id: ref.id, ...newWine });
      showMsg(`"${data.name}" added to your cellar.`, 'ok');
    } else {
      const updates = { ...data, last_updated: new Date().toISOString().slice(0,10) };
      await updateDoc(doc(db, 'wines', editingId), updates);
      const idx = allWines.findIndex(w => w.id === editingId);
      if (idx !== -1) allWines[idx] = { ...allWines[idx], ...updates };
      showMsg('Changes saved.', 'ok');
    }
    updateStats();
    renderGrid();
    setTimeout(closeDrawer, 900);
  } catch (e) {
    showMsg(`Error: ${e.message}`, 'err');
  } finally {
    btnSave.disabled = false;
    btnSave.textContent = drawerMode === 'add' ? 'Add to Cellar' : 'Save Changes';
  }
});

// ── Delete ───────────────────────────────────────────────────────────────────
btnDelete.addEventListener('click', async () => {
  if (!deleteConfirm) {
    deleteConfirm = true;
    btnDelete.textContent = 'Confirm Delete';
    btnDelete.classList.add('confirm');
    return;
  }
  btnDelete.disabled = true;
  btnDelete.textContent = 'Deleting…';
  try {
    await deleteDoc(doc(db, 'wines', editingId));
    allWines = allWines.filter(w => w.id !== editingId);
    updateStats();
    renderGrid();
    closeDrawer();
  } catch (e) {
    showMsg(`Error: ${e.message}`, 'err');
    btnDelete.disabled = false;
    btnDelete.textContent = 'Confirm Delete';
  }
});

// Close on overlay / cancel / X
overlay.addEventListener('click', closeDrawer);
btnCancel.addEventListener('click', closeDrawer);
document.getElementById('drawer-close').addEventListener('click', closeDrawer);

// Add wine button
document.getElementById('btn-add-wine').addEventListener('click', () => openDrawer('add'));

// Status toggle
document.querySelectorAll('.s-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.s-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── Load ─────────────────────────────────────────────────────────────────────
async function loadWines() {
  try {
    const snap = await getDocs(collection(db, 'wines'));
    allWines = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    document.getElementById('loading').style.display = 'none';
    updateStats();
    renderGrid();
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:var(--drink-now)">Could not load cellar: ${e.message}</p>
       <p style="color:var(--muted);margin-top:8px;font-size:12px">Check Firestore rules allow reads.</p>`;
  }
}

function updateStats() {
  document.getElementById('stat-total').textContent = allWines.length;
  document.getElementById('stat-drink-now').textContent =
    allWines.filter(w => w.status === 'Drink Now').length;
  const total = allWines.reduce((s, w) => s + (w.value_mid || 0), 0);
  document.getElementById('stat-value').textContent = '$' + Math.round(total).toLocaleString();
}

const STATUS_ORDER = { 'Drink Now': 0, 'Peak': 1, 'Hold': 2 };

function getFiltered() {
  let wines = [...allWines];
  if (activeFilter !== 'All') wines = wines.filter(w => w.status === activeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    wines = wines.filter(w =>
      [w.name, w.producer, w.variety, w.region, w.country, w.classification]
        .some(f => f && f.toLowerCase().includes(q))
    );
  }
  wines.sort((a, b) => {
    switch (activeSort) {
      case 'urgency':      return (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9);
      case 'value-desc':   return (b.value_mid || 0) - (a.value_mid || 0);
      case 'value-asc':    return (a.value_mid || 0) - (b.value_mid || 0);
      case 'vintage-asc':  return (parseInt(a.vintage) || 9999) - (parseInt(b.vintage) || 9999);
      case 'vintage-desc': return (parseInt(b.vintage) || 0) - (parseInt(a.vintage) || 0);
      case 'name':         return (a.name || '').localeCompare(b.name || '');
      case 'country':      return (a.country || '').localeCompare(b.country || '');
      default: return 0;
    }
  });
  return wines;
}

function renderGrid() {
  const wines = getFiltered();
  const grid  = document.getElementById('wine-grid');
  const empty = document.getElementById('empty-msg');
  const label = document.getElementById('grid-label');

  label.textContent = `${wines.length} bottle${wines.length !== 1 ? 's' : ''}`;
  grid.innerHTML = '';

  if (!wines.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  wines.forEach(w => {
    const sc        = (w.status || '').toLowerCase().replace(' ', '-');
    const drinkNow  = w.status === 'Drink Now';
    const isPeak    = w.status === 'Peak';
    const drinkRange = w.drink_from && w.drink_by
      ? `${w.drink_from} – ${w.drink_by}`
      : (w.drink_from || w.drink_by || '—');
    const valueMid   = w.value_mid ? `$${Math.round(w.value_mid)}` : '—';
    const valueRange = w.value_low && w.value_high ? `$${w.value_low}–$${w.value_high}` : '';
    const windowClass = drinkNow ? 'urgent' : isPeak ? 'peak-w' : '';

    const card = document.createElement('div');
    card.className = 'wine-card';
    card.innerHTML = `
      <div class="card-stripe ${sc}"></div>
      <div class="card-body">
        <div class="card-head">
          <div class="wine-name">${esc(w.name || 'Unknown Wine')}</div>
          <div class="badge ${sc}">${esc(w.status || '')}</div>
        </div>
        <div class="producer">${esc(w.producer || '')}</div>
        <div class="tags">
          ${w.vintage ? `<div class="tag"><strong>${esc(w.vintage)}</strong></div>` : ''}
          ${w.variety ? `<div class="tag">${esc(w.variety)}</div>` : ''}
          ${w.region  ? `<div class="tag">${esc(w.region)}</div>` : ''}
          ${w.country ? `<div class="tag">${esc(w.country)}</div>` : ''}
          ${w.classification ? `<div class="tag classification">${esc(w.classification)}</div>` : ''}
        </div>
        <hr class="card-divider">
        <div class="card-footer">
          <div class="value-block">
            <div class="lbl">Est. Value</div>
            <div class="amount">${valueMid}</div>
            ${valueRange ? `<div class="range">${valueRange}</div>` : ''}
          </div>
          <div class="drink-block">
            <div class="lbl">Drink Window</div>
            <div class="window ${windowClass}">${drinkRange}</div>
          </div>
        </div>
        ${w.notes ? `<div class="notes">${esc(w.notes)}</div>` : ''}
      </div>
      <div class="card-edit-hint">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
      </div>`;

    card.addEventListener('click', () => openDrawer('edit', w));
    grid.appendChild(card);
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Controls ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.status;
    renderGrid();
  });
});
document.getElementById('sort-select').addEventListener('change', e => {
  activeSort = e.target.value; renderGrid();
});
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value; renderGrid();
});

loadWines();
</script>
</body>
</html>
